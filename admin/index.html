<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>猫咪的博客</title>
    <link rel="stylesheet" href="/libs/fonts/fonts.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1 class="brand-title">猫咪的博客</h1>
        <button type="button" class="btn primary" id="btn-new">新文章</button>
        <div class="side-scroll">
          <div id="post-list" class="post-list"></div>
        </div>
        <div class="side-foot">
          <div class="push-meta" id="push-meta">
            <div><span class="k">远端</span> <span id="push-remote">—</span></div>
            <div><span class="k">分支</span> <span id="push-branch">—</span></div>
            <div><span class="k">版本</span> <span id="push-commit">—</span></div>
            <div><span class="k">上次</span> <span id="push-at">—</span></div>
          </div>
          <button type="button" class="btn soft" id="btn-push">推送</button>
        </div>
      </aside>

      <main class="workspace">
        <div class="empty" id="empty">
          <p>选择一篇文章，或新建。</p>
        </div>

        <section class="editor-shell hidden" id="editor-shell">
          <header class="editor-bar">
            <div class="file-meta">
              <span id="live-title" class="live-title"></span>
              <span id="live-file" class="live-file"></span>
            </div>
            <span id="edit-state" class="edit-state" role="status">已保存</span>
          </header>

          <div class="split">
            <div class="pane">
              <div class="pane-label">Markdown</div>
              <textarea id="editor" spellcheck="false" placeholder="开始写…"></textarea>
            </div>
            <div class="pane">
              <div class="pane-label">预览</div>
              <article id="preview" class="preview prose"></article>
            </div>
          </div>
        </section>
      </main>
    </div>
    <dialog class="name-dialog" id="name-dialog">
      <form method="dialog" id="name-form" class="name-form">
        <h2 id="name-dialog-title">编辑文件名</h2>
        <label class="name-field">
          <span>日期</span>
          <input type="date" id="name-date" required />
        </label>
        <label class="name-field">
          <span>名称</span>
          <input type="text" id="name-slug" required autocomplete="off" />
        </label>
        <div class="name-actions">
          <button type="submit" value="cancel" class="name-btn" id="name-cancel" formnovalidate>取消</button>
          <button type="submit" value="ok" class="name-btn name-btn-ok" id="name-ok">确定</button>
        </div>
      </form>
    </dialog>

    <dialog class="name-dialog" id="push-dialog">
      <form method="dialog" id="push-form" class="name-form">
        <h2>推送说明</h2>
        <label class="name-field">
          <span>说明</span>
          <input type="text" id="push-message" required autocomplete="off" maxlength="200" />
        </label>
        <div class="name-actions">
          <button type="submit" value="cancel" class="name-btn" formnovalidate>取消</button>
          <button type="submit" value="ok" class="name-btn name-btn-ok">推送</button>
        </div>
      </form>
    </dialog>

    <script src="/libs/marked/marked.min.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
